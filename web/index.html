<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a365d">
    <title>Fairy Lights</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/microbit-web-bluetooth@0.7.0/dist/microbit.umd.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Fairy lights</p>
      <h1>Lights</h1>
      <p id="status" role="status"></p>
      <button id="connect" type="button" hidden>Connect</button>
      <label id="toggle-control" class="switch" hidden>
        <input id="toggle" type="checkbox" role="switch" aria-label="Lights">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
      </label>
      <button id="debug-toggle" class="debug-toggle" type="button" aria-label="Show debug log" aria-expanded="false" aria-controls="debug-panel">?</button>
      <section id="debug-panel" class="debug-panel" hidden aria-label="Debug log">
        <pre id="debug-output" aria-live="polite"></pre>
      </section>
    </main>
  </body>
</html>
