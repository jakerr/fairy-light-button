<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a365d">
    <title>Fairy Lights</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/microbit-web-bluetooth@0.7.0/dist/microbit.umd.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Fairy lights</p>
      <h1>Lights</h1>
      <p id="status" role="status">Not connected</p>
      <button id="toggle" type="button" disabled aria-pressed="false">Connect</button>
      <button id="debug-toggle" class="debug-toggle" type="button" aria-expanded="false" aria-controls="debug-panel">Debug</button>
      <section id="debug-panel" class="debug-panel" hidden aria-label="Debug log">
        <pre id="debug-output" aria-live="polite"></pre>
      </section>
    </main>
  </body>
</html>
